<script>

  schema: { src: { type: "map", is: "uniform" } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
  fragmentShader: "uniform sampler2D src; varying vec2 vUv; void main(){ vec4 c = texture2D(src, vUv); float d = c.g - max(c.r,c.b); float a = 1.0 - smoothstep(0.08,0.25,d); c.g = min(c.g, max(c.r,c.b)+0.02); gl_FragColor = vec4(c.rgb, a); }"
});

<script>
const hint = document.getElementById('hint');
const worldDiv = document.getElementById('world');
const closeBtn = document.getElementById('closeBtn');
const lookHint = document.getElementById('lookHint');
const caption = document.getElementById('caption');
const factBox = document.getElementById('factBox');
let openFor = null;
let arLocked = false;   // true while the 360 scene is open (or briefly after closing) -- ignores all scans
let currentFact = '';   // this page's fun-fact, set fresh each time a page is scanned
let currentFactAudio = null;  // path to a real recorded clip for this page's fact, if one exists
const factAudioEl = document.getElementById('factAudioEl');

function playFactAudio() {
  if (!currentFactAudio) return false;
  factAudioEl.src = currentFactAudio;
  factAudioEl.currentTime = 0;
  factAudioEl.play().catch(() => {});
  return true;
}

// --- spoken guidance script. Each step now runs an "action": speak(...) uses the phone's
// built-in voice, or -- for any page with a real recorded clip (see PAGE_DATA's fact_audio) --
// playFactAudio() plays that instead. This is the reusable pattern: give any page's PAGE_DATA
// entry a "fact_audio" filename and it automatically uses that recording instead of TTS. ---
const NARRATION = [
  { delay: 1200,  action: () => speak("Ho ho ho! Great colouring!") },
  { delay: 4200,  action: () => { if (!playFactAudio()) speak(currentFact); } },
  { delay: 9500,  action: () => speak("Now turn all the way around behind you... there's a Christmas tree waiting!") },
  { delay: 14000, action: () => speak("And look to your left, can you see the twinkling lights?") }
];
let narrationTimers = [];
let voiceUnlocked = false;
let narrationStarted = false;
let voicePool = [];              // keeps utterances alive -- Safari silently drops them otherwise
speechSynthesis.getVoices();     // warm up the voice list early
window.speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95; u.pitch = 1.0; u.volume = 1.0;
  const voices = speechSynthesis.getVoices();
  const en = voices.find(v => v.lang && v.lang.startsWith('en'));
  if (en) u.voice = en;
  voicePool.push(u);
  u.onend = u.onerror = () => { voicePool = voicePool.filter(x => x !== u); };
  speechSynthesis.speak(u);
}
function startNarration() {
  stopNarration();
  narrationTimers = NARRATION.map(step =>
    setTimeout(() => { if (openFor !== null) step.action(); }, step.delay)
  );
}
function stopNarration() {
  narrationTimers.forEach(clearTimeout);
  narrationTimers = [];
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
// iOS only allows speech synthesis after a real tap -- piggyback on the first tap in the scene.
function unlockVoiceOnce() {
  if (voiceUnlocked) return;
  voiceUnlocked = true;
  speechSynthesis.resume();
  speak('Hello');
  factAudioEl.muted = true;
  factAudioEl.play().then(() => { factAudioEl.pause(); factAudioEl.muted = false; }).catch(() => { factAudioEl.muted = false; });
  if (!narrationStarted) { narrationStarted = true; startNarration(); }
}

const WORLD_INNER = `

<a-sphere radius="0.035" color="#fff" material="shader:flat" position="-3.12 3.4 -4.03" animation="property: position; to: -3.12 -1.1 -4.03; dur: 6416; delay: 257; loop: true; easing: linear"></a-sphere>

</a-entity>

function openWorld(idx, text, fact, factAudio) {
  openFor = idx;
  arLocked = true;
  currentFact = fact || '';
  currentFactAudio = factAudio || null;
  worldDiv.innerHTML = WORLD_INNER;
  worldDiv.classList.add('show');
  closeBtn.classList.add('show');
  caption.textContent = text;
  caption.classList.add('show');
  factBox.textContent = currentFact;
  factBox.classList.add('show');
  hint.style.opacity = '0';
  document.getElementById('srcVid').play();
  lookHint.classList.add('show');
  setTimeout(() => lookHint.classList.remove('show'), 6000);
  const worldScene = worldDiv.querySelector('a-scene');
  worldScene.addEventListener('loaded', () => {
    worldScene.renderer.setClearColor(0x000000, 0);
    if (worldScene.canvas) worldScene.canvas.style.setProperty('background', 'transparent', 'important');
  });
  // canvas can exist slightly before 'loaded' fires -- force it transparent as soon as it appears too
  let tries = 0;
  const forceClear = setInterval(() => {
    const cv = worldDiv.querySelector('canvas');
    if (cv) { cv.style.setProperty('background', 'transparent', 'important'); clearInterval(forceClear); }
    if (++tries > 40) clearInterval(forceClear);
  }, 50);
  narrationStarted = false;
  stopNarration();
  // iOS Safari only grants gyroscope access from inside a real tap -- ask on first tap of the scene.
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    const grant = () => { DeviceOrientationEvent.requestPermission().catch(() => {}); unlockVoiceOnce(); worldDiv.removeEventListener('touchstart', grant); };
    worldDiv.addEventListener('touchstart', grant, { once: true });
  } else {
    worldDiv.addEventListener('touchstart', unlockVoiceOnce, { once: true });
  }
}
function closeWorld() {
  openFor = null;
  worldDiv.classList.remove('show');
  worldDiv.innerHTML = '';
  closeBtn.classList.remove('show');
  caption.classList.remove('show');
  factBox.classList.remove('show');
  hint.style.opacity = '1';
  stopNarration();
  factAudioEl.pause();
  // brief cooldown so pointing at the same page doesn't instantly reopen it
  setTimeout(() => { arLocked = false; }, 1800);
}
closeBtn.addEventListener('click', closeWorld);

document.querySelectorAll('[mindar-image-target]').forEach((el, idx) => {
  el.addEventListener('targetFound', () => {
    if (arLocked) return;                 // ignore scans while a scene is open / cooling down
    if (openFor !== idx) openWorld(idx, el.dataset.caption, el.dataset.fact, el.dataset.factAudio);
  });
  // targetLost is ignored on purpose: the 360 scene stays open until the person taps close.
});
</script>
