<style>
body{margin:0;overflow:hidden;font-family:sans-serif}
#hint{position:fixed;top:14px;left:0;right:0;text-align:center;color:#fff;font:700 18px sans-serif;
  text-shadow:0 1px 4px #000;z-index:9;pointer-events:none;transition:opacity .3s}
#card{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px) scale(.85);
  opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;z-index:20;text-align:center}
#card.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto}
#keyedCanvas{width:220px;height:220px;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
#caption{margin-top:-6px;background:#fff;color:#c0281f;font-weight:800;font-size:17px;
  padding:6px 16px;border-radius:20px;display:inline-block;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#closeBtn{position:absolute;top:-6px;right:6px;width:30px;height:30px;border-radius:50%;background:#1b1420;
  color:#fff;border:2px solid #fff;font-size:16px;line-height:26px;font-weight:700}
</style></head><body>

<div id="card">
  <button id="closeBtn">✕</button>
  <canvas id="keyedCanvas" width="220" height="220"></canvas>
  <div id="caption">Ho ho ho!</div>
</div>

<script>
// --- live chroma-key: draws the green-screen video onto a transparent canvas, every frame,
// regardless of whether MindAR is currently tracking anything ---
const srcVid = document.getElementById('srcVid');
const off = document.createElement('canvas'); off.width = 220; off.height = 220;
const octx = off.getContext('2d', { willReadFrequently: true });
const vis = document.getElementById('keyedCanvas');
const vctx = vis.getContext('2d');
(function loop() {
  if (srcVid.readyState >= 2) {
    octx.drawImage(srcVid, 0, 0, 220, 220);
    const id = octx.getImageData(0, 0, 220, 220), d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i+1], b = d[i+2], diff = g - Math.max(r, b);
      d[i+3] = diff > 70 ? 0 : diff > 25 ? 255 * (1 - (diff - 25) / 45) : 255;
      if (g > Math.max(r, b)) d[i+1] = Math.max(r, b);
    }
    vctx.putImageData(id, 0, 0);
  }
  requestAnimationFrame(loop);
})();

// --- lock-on behaviour: once a page is found, the card STAYS UP even if the phone moves
// away from the page. It only closes when the person taps the X, or a DIFFERENT page is found. ---
const card = document.getElementById('card'), hint = document.getElementById('hint'), caption = document.getElementById('caption');
let openFor = null;

function openCard(idx, text) {
  openFor = idx;
  caption.textContent = text;
  card.classList.add('show');
  hint.style.opacity = '0';
  srcVid.play();
}
document.getElementById('closeBtn').addEventListener('click', () => {
  openFor = null;
  card.classList.remove('show');
  hint.style.opacity = '1';
});

document.querySelectorAll('[mindar-image-target]').forEach((el, idx) => {
  el.addEventListener('targetFound', () => {
    if (openFor !== idx) openCard(idx, el.dataset.caption);
  });
  // targetLost is intentionally ignored -- the card keeps showing after the page leaves frame.
});
</script>
</body></html>
